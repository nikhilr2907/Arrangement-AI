[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-arranger"
version = "0.1.0"
description = "Learned within-bar playback decisions over supplied MIDI and audio stems"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.5", "mido>=1.3", "soundfile>=0.13", "scipy>=1.12", "PyYAML>=6"]

[project.optional-dependencies]
audio = ["transformers>=4.40,<5"]
midi = ["musicbert-hf @ git+https://github.com/malcolmsailor/musicbert_hf.git@64a054c791c2372e146d59cb0b04a5f5eba23fc0"]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/contracts.py", "src/timing.py", "src/config.py", "src/data", "src/features", "src/models", "src/training", "src/inference/state.py", "src/inference/candidates.py", "src/inference/generator.py", "src/rendering", "src/cli"]

[[tool.mypy.overrides]]
module = ["mido.*", "soundfile.*", "scipy.*", "musicbert_hf.*", "transformers.*"]
ignore_missing_imports = true
